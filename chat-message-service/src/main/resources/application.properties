# message-server
spring.application.name=chat-message-service
server.port=10002

# mysql
spring.datasource.url=jdbc:mysql://SERVER_IP_PLACEHOLDER:3306/chat?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=failedman
spring.datasource.password=PASSWORD_PLACEHOLDER
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis
spring.data.redis.host=SERVER_IP_PLACEHOLDER
spring.data.redis.password=PASSWORD_PLACEHOLDER
spring.data.redis.port=6379
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1

# hutool
server.worker-id=1
server.datacenter-id=1

# logger
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - [%highlight(%level)] : %msg%n
